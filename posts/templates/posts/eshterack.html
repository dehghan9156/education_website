{% extends "base.html" %}
{% block content %}

<div class="container py-5">
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center">
    {% for esh in eshteracks %}
      <div class="col">
        <div class="card h-100 shadow-sm border-0 rounded-3">
          <div class="card-body d-flex flex-column text-center">
            <h5 class="card-title fw-bold text-primary">{{ esh.type }}</h5>
            <p class="card-text">
              <span class="d-block fs-5 fw-semibold text-success">{{ esh.duration }}</span>
              <span class="d-block fs-4 fw-bold text-dark">{{ esh.price }}</span>
            </p>
            <div class="mt-auto">
              <form method="post" action="{%url "posts:payment" esh.pk%}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-primary px-4 py-2 rounded-pill">
                  Get Eshterack
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock content %}
